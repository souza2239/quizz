<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo de Conhecimentos Gerais</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.25rem;
            color: #1f2937;
        }

        .quiz-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.35s ease-out forwards;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .start-screen {
            text-align: center;
            padding: 1rem 0;
        }

        .start-screen h1 {
            color: #111827;
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        .start-screen p {
            color: #4b5563;
            font-size: 1.125rem;
            margin-bottom: 1.5rem;
        }

        .quiz-header {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #e5e7eb;
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 100%);
            border-radius: 9999px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-btn {
            width: 100%;
            padding: 1rem 1.25rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background-color: #ffffff;
            color: #374151;
            font-size: 1rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #f3f4f6;
            border-color: #818cf8;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .option-btn.correct {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }

        .option-btn.wrong {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
        }

        .btn-primary {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 0.875rem 1.75rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.2s ease;
            align-self: center;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        .result-screen {
            text-align: center;
        }

        .result-screen h2 {
            font-size: 1.875rem;
            font-weight: 800;
            color: #111827;
        }

        .score-badge {
            background: #f3f4f6;
            border-radius: 16px;
            padding: 1.25rem;
            margin: 0.5rem 0;
        }

        .score-badge .score-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: #4f46e5;
        }

        .score-badge .performance-text {
            font-size: 1.125rem;
            font-weight: 700;
            color: #374151;
            margin-top: 0.25rem;
        }

        .summary-box {
            text-align: left;
            max-height: 280px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .summary-item {
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.925rem;
            line-height: 1.4;
        }

        .summary-item.correct-item {
            background-color: #f0fdf4;
            border-left: 4px solid #22c55e;
        }

        .summary-item.wrong-item {
            background-color: #fef2f2;
            border-left: 4px solid #ef4444;
        }

        .summary-item .q-title {
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.25rem;
        }

        .summary-item .user-ans {
            color: #4b5563;
        }

        .summary-item .correct-ans {
            color: #15803d;
            font-weight: 600;
            margin-top: 0.125rem;
        }

        @media (max-width: 480px) {
            .quiz-card {
                padding: 1.5rem;
            }

            .start-screen h1 {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <main class="quiz-card">
        <!-- TELA INICIAL -->
        <section id="start-screen" class="screen active start-screen">
            <h1>Desafio do Conhecimento</h1>
            <p>Demonstre suas habilidades respondendo a 10 perguntas de Conhecimentos Gerais!</p>
            <button id="start-btn" class="btn-primary">Iniciar Quiz</button>
        </section>

        <!-- TELA DO QUIZ -->
        <section id="quiz-screen" class="screen">
            <header class="quiz-header">
                <div class="progress-info">
                    <span id="question-counter">Pergunta 1 de 10</span>
                    <span id="progress-percentage">10%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progress-bar" class="progress-bar-fill"></div>
                </div>
            </header>

            <h2 id="question-text" class="question-text">Carregando pergunta...</h2>

            <div id="options-container" class="options-grid">
                <!-- Opções dinâmicas -->
            </div>

            <button id="next-btn" class="btn-primary hidden">Próxima Pergunta</button>
        </section>

        <!-- TELA DE RESULTADO -->
        <section id="result-screen" class="screen result-screen">
            <h2>Resultado Final</h2>
            
            <div class="score-badge">
                <div class="score-number"><span id="final-score">0</span>/10</div>
                <div id="performance-message" class="performance-text">Excelente!</div>
            </div>

            <div class="summary-box" id="summary-box">
                <!-- Resumo dinâmico -->
            </div>

            <button id="restart-btn" class="btn-primary">Refazer Quiz</button>
        </section>
    </main>

    <script>
        const quizQuestions = [
            {
                question: "Qual é o maior planeta do Sistema Solar?",
                options: ["Terra", "Júpiter", "Saturno", "Marte"],
                correct: 1
            },
            {
                question: "Quem pintou a obra 'Mona Lisa'?",
                options: ["Vincent van Gogh", "Pablo Picasso", "Leonardo da Vinci", "Claude Monet"],
                correct: 2
            },
            {
                question: "Qual é o país com a maior população do mundo atualmente?",
                options: ["China", "Estados Unidos", "Índia", "Rússia"],
                correct: 2
            },
            {
                question: "Qual é o elemento químico representado pelo símbolo 'O'?",
                options: ["Ouro", "Oxigênio", "Osvaldo", "Ozônio"],
                correct: 1
            },
            {
                question: "Em que ano ocorreu o descobrimento do Brasil?",
                options: ["1500", "1492", "1822", "1889"],
                correct: 0
            },
            {
                question: "Qual é o metal cujo símbolo químico é 'Au'?",
                options: ["Prata", "Cobre", "Alumínio", "Ouro"],
                correct: 3
            },
            {
                question: "Quantos ossos tem o corpo humano adulto?",
                options: ["180", "206", "300", "215"],
                correct: 1
            },
            {
                question: "Qual é a capital da França?",
                options: ["Londres", "Berlim", "Paris", "Madri"],
                correct: 2
            },
            {
                question: "Qual livro é considerado o mais vendido no mundo depois da Bíblia?",
                options: ["Dom Quixote", "O Senhor dos Anéis", "O Pequeno Príncipe", "Harry Potter"],
                correct: 0
            },
            {
                question: "Qual oceano banha a costa leste do Brasil?",
                options: ["Oceano Pacífico", "Oceano Índico", "Oceano Ártico", "Oceano Atlântico"],
                correct: 3
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        const startScreen = document.getElementById("start-screen");
        const quizScreen = document.getElementById("quiz-screen");
        const resultScreen = document.getElementById("result-screen");

        const startBtn = document.getElementById("start-btn");
        const nextBtn = document.getElementById("next-btn");
        const restartBtn = document.getElementById("restart-btn");

        const questionCounter = document.getElementById("question-counter");
        const progressPercentage = document.getElementById("progress-percentage");
        const progressBar = document.getElementById("progress-bar");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");

        const finalScore = document.getElementById("final-score");
        const performanceMessage = document.getElementById("performance-message");
        const summaryBox = document.getElementById("summary-box");

        startBtn.addEventListener("click", startQuiz);
        nextBtn.addEventListener("click", handleNextQuestion);
        restartBtn.addEventListener("click", startQuiz);

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            switchScreen(quizScreen);
            renderQuestion();
        }

        function switchScreen(targetScreen) {
            [startScreen, quizScreen, resultScreen].forEach(screen => {
                screen.classList.remove("active");
            });
            targetScreen.classList.add("active");
        }

        function renderQuestion() {
            nextBtn.classList.add("hidden");
            optionsContainer.innerHTML = "";

            const q = quizQuestions[currentQuestionIndex];
            const total = quizQuestions.length;
            const progress = ((currentQuestionIndex + 1) / total) * 100;

            questionCounter.textContent = `Pergunta ${currentQuestionIndex + 1} de ${total}`;
            progressPercentage.textContent = `${Math.round(progress)}%`;
            progressBar.style.width = `${progress}%`;

            questionText.textContent = q.question;

            q.options.forEach((optText, index) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `<span>${optText}</span>`;
                btn.addEventListener("click", () => handleOptionClick(index));
                optionsContainer.appendChild(btn);
            });
        }

        function handleOptionClick(selectedIndex) {
            const q = quizQuestions[currentQuestionIndex];
            const buttons = optionsContainer.querySelectorAll(".option-btn");
            const isCorrect = selectedIndex === q.correct;

            if (isCorrect) {
                score++;
            }

            userAnswers.push({
                question: q.question,
                userChoice: q.options[selectedIndex],
                correctChoice: q.options[q.correct],
                isCorrect: isCorrect
            });

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correct) {
                    btn.classList.add("correct");
                    btn.innerHTML += " <span>✅</span>";
                } else if (idx === selectedIndex) {
                    btn.classList.add("wrong");
                    btn.innerHTML += " <span>❌</span>";
                }
            });

            nextBtn.classList.remove("hidden");
        }

        function handleNextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            switchScreen(resultScreen);
            finalScore.textContent = score;

            const percentage = (score / quizQuestions.length) * 100;
            if (percentage === 100) {
                performanceMessage.textContent = "Desempenho Perfeito! 🎉 Excelente!";
            } else if (percentage >= 70) {
                performanceMessage.textContent = "Muito bom! Excelente resultado! 👏";
            } else if (percentage >= 50) {
                performanceMessage.textContent = "Bom trabalho, mas dá para melhorar! 👍";
            } else {
                performanceMessage.textContent = "Que pena... Estude um pouco mais e tente novamente! 📚";
            }

            renderSummary();
        }

        function renderSummary() {
            summaryBox.innerHTML = "";
            userAnswers.forEach((ans, idx) => {
                const item = document.createElement("div");
                item.className = `summary-item ${ans.isCorrect ? 'correct-item' : 'wrong-item'}`;
                item.innerHTML = `
                    <div class="q-title">${idx + 1}. ${ans.question}</div>
                    <div class="user-ans">Sua resposta: <strong>${ans.userChoice}</strong> ${ans.isCorrect ? '✅' : '❌'}</div>
                    ${!ans.isCorrect ? `<div class="correct-ans">Resposta correta: <strong>${ans.correctChoice}</strong></div>` : ''}
                `;
                summaryBox.appendChild(item);
            });
        }
    </script>
</body>
</html>
